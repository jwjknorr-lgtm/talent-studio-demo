<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Auto Tech Talent Studio</title>
<style>
:root{--bg:#F5F5F7;--card:#fff;--text:#1D1D1F;--muted:#6E6E73;--accent:#0071E3;--bad:#C9302C;--line:rgba(0,0,0,.18)}
@media (prefers-color-scheme: dark){:root{--bg:#1C1C1E;--card:#2C2C2E;--text:#F5F5F7;--muted:#AEAEB2;--accent:#0A84FF;--bad:#FF6961;--line:rgba(255,255,255,.24);color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.47 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;padding:16px}
main{background:var(--card);border-radius:20px;padding:36px 32px;max-width:420px;width:100%;box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 12px 36px rgba(0,0,0,.16)}
h1{font-size:1.6rem;letter-spacing:-.02em;margin:0 0 6px}p{margin:0 0 18px;color:var(--muted);font-size:.94rem}
label{display:block;font-weight:600;font-size:.94rem;margin-bottom:6px}
input{width:100%;font:inherit;font-size:1.2rem;letter-spacing:.08em;text-transform:uppercase;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
input:focus{outline:none;box-shadow:0 0 0 4px rgba(0,113,227,.32)}
button{margin-top:14px;width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
#msg{min-height:1.5em;margin:12px 0 0;font-size:.94rem}#msg.bad{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:.9rem;color:var(--muted)}.row input{width:17px;height:17px}
small{display:block;margin-top:18px;color:var(--muted);font-size:.8rem}
</style></head><body>
<main>
<h1>Auto Tech Talent Studio</h1>
<p>MGMT 740 · Team Talent Acquisition prototype. Enter the access code you were given.</p>
<form id="f" autocomplete="off">
<label for="code">Access code</label>
<input id="code" name="code" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" autofocus>
<div class="row"><input type="checkbox" id="keep"><label for="keep" style="margin:0;font-weight:400">Remember the code on this device</label></div>
<button id="go" type="submit">Open the app</button>
<p id="msg" role="status" aria-live="polite"></p>
</form>
<small>Demo data only: public or synthetic. No company files. The app is stored encrypted and opens only with the code.</small>
</main>
<script>
(function () {
  var SALT = 'arzWFPrrornaxc3ZaEsbvQ==', CHECK = 'x7FhtDfupQqhJsyfAytqyxP2crR55CwTjwJUCPZ03n+kC4iyRakEulKu3LM=', ROUNDS = 600000;
  var f = document.getElementById('f'), input = document.getElementById('code'), msg = document.getElementById('msg'), go = document.getElementById('go'), keep = document.getElementById('keep');
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function say(t, bad) { msg.textContent = t; msg.className = bad ? 'bad' : ''; }
  function derive(code) {
    var clean = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
    return crypto.subtle.importKey('raw', new TextEncoder().encode(clean), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(SALT), iterations: ROUNDS, hash: 'SHA-256' }, k, 256); });
  }
  function dec(bits, buf) { return crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']).then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, k, buf.slice(12)); }); }
  function unlock(code, quiet) {
    if (!window.crypto || !crypto.subtle) { say('This browser cannot open the app here. Use a current Chrome, Edge or Safari over https.', true); return; }
    go.disabled = true; if (!quiet) say('Checking the code…');
    derive(code).then(function (bits) {
      return dec(bits, b64(CHECK)).then(function () {
        say('Code accepted. Opening…');
        try { sessionStorage.setItem('ts.lock.k', btoa(String.fromCharCode.apply(null, new Uint8Array(bits)))); if (keep.checked) localStorage.setItem('ts.lock.code', code); } catch (e) {}
        return fetch('app.bin').then(function (r) { if (!r.ok) throw new Error('load'); return r.arrayBuffer(); }).then(function (buf) { return dec(bits, new Uint8Array(buf)); })
          .then(function (plain) { var html = new TextDecoder().decode(plain); document.open(); document.write(html); document.close(); });
      }, function () { go.disabled = false; try { localStorage.removeItem('ts.lock.code'); } catch (e) {} say(quiet ? '' : 'That code is not right. Check it and try again.', !quiet); input.select(); });
    }).catch(function () { go.disabled = false; say('The app could not be loaded. Check your connection and reload the page.', true); });
  }
  f.addEventListener('submit', function (e) { e.preventDefault(); if (!input.value.trim()) { say('Enter the access code first.', true); return; } unlock(input.value); });
  input.addEventListener('input', function () { if (msg.className === 'bad') say(''); });
  try { var saved = localStorage.getItem('ts.lock.code'); if (saved) { input.value = saved; keep.checked = true; unlock(saved, true); } } catch (e) {}
})();
</script>
</body></html>
